name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to the same branch makes the previous run's answer irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # postgis/postgis, not postgres: the search needs the extension, and a
      # CI run against a plain postgres would fail at the migration rather
      # than at the thing it was meant to test.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: listings
          POSTGRES_PASSWORD: listings
          POSTGRES_DB: listings
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U listings -d listings"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://listings:listings@localhost:5433/listings
      TEST_DATABASE_URL: postgres://listings:listings@localhost:5433/listings_test
      THROTTLE_LIMIT: 100

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Create the test database
        run: pnpm db:test:create

      # Runs after the unit tests so a failure here is unambiguously about the
      # database and not about logic the unit tests already cover.
      - name: Integration tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # Builds the image but does not push it. It catches the failure mode
      # where the app runs fine from source and the container does not.
      - name: Build the image
        run: docker build -t property-listings-api:ci .
